name: Aggiungi indici interattivi cinema

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  add-toc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Genera gli indici
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          import unicodedata

          folder = Path('03_STORIA_DEL_CINEMA')
          start_marker = '<!-- INDICE INTERATTIVO: INIZIO -->'
          end_marker = '<!-- INDICE INTERATTIVO: FINE -->'

          def slugify(text):
              text = re.sub(r'[`*_~]', '', text)
              text = unicodedata.normalize('NFKD', text).encode('ascii', 'ignore').decode('ascii')
              text = text.lower()
              text = re.sub(r'[^a-z0-9\\s-]', '', text)
              text = re.sub(r'[\\s-]+', '-', text).strip('-')
              return text

          for path in sorted(folder.glob('*.md')):
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'\\n?'+re.escape(start_marker)+r'.*?'+re.escape(end_marker)+r'\\n?', '\\n', text, flags=re.S)

              headings = []
              used = {}
              for line in text.splitlines():
                  m = re.match(r'^(#{2,3})\\s+(.+?)\\s*$', line)
                  if not m:
                      continue
                  level = len(m.group(1))
                  title = m.group(2).strip()
                  anchor = slugify(title)
                  count = used.get(anchor, 0)
                  used[anchor] = count + 1
                  if count:
                      anchor = f'{anchor}-{count}'
                  headings.append((level, title, anchor))

              if not headings:
                  continue

              toc = [start_marker, '', '## Indice interattivo', '']
              for level, title, anchor in headings:
                  indent = '  ' if level == 3 else ''
                  toc.append(f'{indent}- [{title}](#{anchor})')
              toc += ['', end_marker, '']
              toc_text = '\\n'.join(toc)

              lines = text.splitlines(keepends=True)
              insert_at = None
              for i, line in enumerate(lines):
                  if re.match(r'^#\\s+', line):
                      insert_at = i + 1
                      break
              if insert_at is None:
                  insert_at = 0

              new_text = ''.join(lines[:insert_at]) + '\\n' + toc_text + ''.join(lines[insert_at:])
              path.write_text(new_text, encoding='utf-8')
              print(f'Indice aggiunto: {path}')
          PY

      - name: Commit delle modifiche e rimozione workflow temporaneo
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '03_STORIA_DEL_CINEMA' ".github/workflows/aggiungi-indici-cinema.yml"
          git rm ".github/workflows/aggiungi-indici-cinema.yml"
          if git diff --cached --quiet; then
            echo 'Nessuna modifica da salvare.'
            exit 0
          fi
          git commit -m 'Aggiungi indici interattivi ai materiali di cinema'
          git push
